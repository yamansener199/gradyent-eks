apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

configMapGenerator:
  - name: gitops-repo-config
    envs:
      - repo.env

resources:
  # cert-manager, aws-lbc, external-dns, argocd-ingress: installed by Terraform before Argo CD.
  - metrics-server-app.yaml
  - karpenter-app.yaml
  - cilium-app.yaml
  - kyverno-app.yaml
  - kyverno-policies-app.yaml
  - falco-app.yaml
  - istio-base-app.yaml
  - istiod-app.yaml
  - fluentd-app.yaml
  - kube-prometheus-stack-app.yaml
  - jaeger-app.yaml

patches:
  - target:
      kind: Application
    patch: |-
      - op: replace
        path: /spec/project
        value: platform

replacements:
  - source:
      kind: ConfigMap
      name: gitops-repo-config
      fieldPath: data.repoURL
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.sources.0.repoURL
  - source:
      kind: ConfigMap
      name: gitops-repo-config
      fieldPath: data.targetRevision
    targets:
      - select:
          kind: Application
        fieldPaths:
          - spec.sources.0.targetRevision
