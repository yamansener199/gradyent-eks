apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco-servicemonitors
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/gradyent/gradyent.ai.git
      targetRevision: main
      path: gitops/apps/falco-servicemonitors
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
