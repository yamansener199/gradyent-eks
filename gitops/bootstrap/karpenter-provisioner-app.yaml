apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-provisioner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/gradyent/gradyent.ai.git
      targetRevision: main
      path: gitops/apps/karpenter-provisioner
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
