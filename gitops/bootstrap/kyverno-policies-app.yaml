apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/gradyent/gradyent.ai.git
      targetRevision: main
      path: gitops/policies
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
