apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

helmCharts:
  - name: jaeger
    repo: https://jaegertracing.github.io/helm-charts
    version: 3.4.1
    releaseName: jaeger
    namespace: observability
    valuesFile: values.yaml

resources:
  - manifests/jaeger-ingress.yaml
