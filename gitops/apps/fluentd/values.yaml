kind: DaemonSet
variant: cloudwatch

serviceAccount:
  create: true
  name: fluentd
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::043470661424:role/gradyent-prod-fluentd

tolerations:
  - operator: Exists

env:
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

# Startup on small nodes (c7a.medium) tails many files; default probe delay=0 kills the container.
livenessProbe:
  httpGet:
    path: /metrics
    port: metrics
  initialDelaySeconds: 90
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /metrics
    port: metrics
  initialDelaySeconds: 45
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 5

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi

fileConfigs:
  01_sources.conf: |-
    <source>
      @type tail
      @id in_tail_container_logs
      path /var/log/containers/*.log
      exclude_path ["/var/log/containers/*fluentd*.log"]
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head false
      <parse>
        @type cri
      </parse>
    </source>

    <source>
      @type prometheus
      bind 0.0.0.0
      port 24231
      metrics_path /metrics
    </source>

  02_filters.conf: |-
    <filter kubernetes.**>
      @type kubernetes_metadata
      @id filter_kube_metadata
    </filter>
    <filter kubernetes.**>
      @type grep
      <exclude>
        key $.kubernetes.namespace_name
        pattern /^logging$/
      </exclude>
    </filter>
    <filter kubernetes.**>
      @type parser
      key_name message
      reserve_data true
      emit_invalid_record_to_error false
      <parse>
        @type json
      </parse>
    </filter>
    <filter kubernetes.**>
      @type record_transformer
      enable_ruby true
      <record>
        cluster gradyent-prod
        environment prod
      </record>
    </filter>

  03_dispatch.conf: |+
    # Unused; override chart default dispatch label.

  03_outputs.conf: |-
    <match kubernetes.**>
      @type cloudwatch_logs
      region eu-central-1
      log_group_name /eks/gradyent-prod/containers
      log_stream_name_key $.kubernetes.pod_name
      auto_create_stream true
      <buffer>
        @type file
        path /var/log/fluentd-buffers/kubernetes
        flush_interval 10s
        retry_forever true
      </buffer>
    </match>

  04_outputs.conf: |+
    # Override chart default elasticsearch output.

plugins:
  - fluent-plugin-kubernetes_metadata_filter
  - fluent-plugin-cloudwatch-logs
