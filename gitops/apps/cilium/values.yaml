# AWS EKS ENI mode — sole CNI (vpc-cni and kube-proxy removed from EKS add-ons).
cni:
  exclusive: true
  enableRouteMTUForCNIChain: true

eni:
  enabled: true
  awsReleaseExcessIPs: true
  awsEnablePrefixDelegation: true

ipam:
  mode: eni

routingMode: native
ipv4NativeRoutingCIDR: 10.0.0.0/16
enableIPv4Masquerade: true
# Incompatible with bpf.masquerade on Cilium 1.17.x (agent fatal on startup).
enableMasqueradeRouteSource: false

bpf:
  masquerade: true

ipMasqAgent:
  enabled: true
  config:
    nonMasqueradeCIDRs:
      - 10.0.0.0/16
    masqLinkLocal: false

kubeProxyReplacement: true
k8sServiceHost: auto
k8sServicePort: auto

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
    labels:
      release: kube-prometheus-stack

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    service:
      type: ClusterIP
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
      labels:
        release: kube-prometheus-stack

operator:
  replicas: 2

tolerations:
  - operator: Exists
