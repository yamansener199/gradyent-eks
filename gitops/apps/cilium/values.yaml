# AWS EKS ENI mode — sole CNI (vpc-cni and kube-proxy removed from EKS add-ons).
cni:
  exclusive: true
  enableRouteMTUForCNIChain: true

eni:
  enabled: true
  awsReleaseExcessIPs: true
  awsEnablePrefixDelegation: true

ipam:
  mode: eni

routingMode: native
ipv4NativeRoutingCIDR: 10.0.0.0/16
enableIPv4Masquerade: true
# Incompatible with bpf.masquerade on Cilium 1.17.x (agent fatal on startup).
enableMasqueradeRouteSource: false

bpf:
  masquerade: true

ipMasqAgent:
  enabled: true
  config:
    nonMasqueradeCIDRs:
      - 10.0.0.0/16
    masqLinkLocal: false

kubeProxyReplacement: true
# k8sServiceHost is set via patches/cilium-*-k8s-api.yaml from Terraform ConfigMap
# cilium-k8s-api (Argo kustomize helm cannot resolve k8sServiceHost=auto).

prometheus:
  enabled: true
  serviceMonitor:
    # Applied by gitops/apps/cilium-servicemonitors after kube-prometheus-stack (wave 5).
    enabled: false

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    service:
      type: ClusterIP
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - http
    serviceMonitor:
      enabled: false

operator:
  replicas: 2

tolerations:
  - operator: Exists
