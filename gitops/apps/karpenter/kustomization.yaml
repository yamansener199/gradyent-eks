apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: karpenter

helmCharts:
  - name: karpenter
    repo: oci://public.ecr.aws/karpenter
    version: 1.9.0
    releaseName: karpenter
    namespace: karpenter
    valuesFile: values.yaml
    includeCRDs: true

resources:
  - manifests/ec2nodeclass.yaml
  - manifests/nodepool-spot.yaml
  - manifests/nodepool-ondemand.yaml
